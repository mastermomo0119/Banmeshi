<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ばんめし桃栗亭</title>

<style>

body{
background:#140d07;
color:#f5d38a;
font-family:sans-serif;
margin:0;
}

.hero{
text-align:center;
padding:30px;
background:#2d1a0f;
}

.panel{
background:#2d1a0f;
margin:20px;
padding:20px;
border-radius:15px;
}

.stamps{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.stamp{
height:55px;
background:#4f3822;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
}

.active{
background:gold;
color:black;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#b8860b;
color:white;
font-size:16px;
}

#reward{
margin-top:15px;
font-size:18px;
text-align:center;
}

#rank{
font-size:28px;
text-align:center;
color:gold;
margin-top:10px;
}

#visit{
text-align:center;
margin-top:10px;
}

footer{
text-align:center;
padding:30px;
color:#9b7d4f;
}

ul{
line-height:2;
}

</style>

</head>

<body>

<header class="hero">

<h1>🏴‍☠️ ばんめし桃栗亭</h1>

<p>海賊団 常連化システム</p>

</header>

<section class="panel">

<h2>🏴‍☠️ スタンプカード</h2>

<div class="stamps" id="stamps"></div>

<div id="reward"></div>

<button onclick="addStamp()">
スタンプGET
</button>

<button onclick="resetToday()">
本日の制限解除
</button>

<button onclick="resetCard()">
カードリセット
</button>

</section>

<section class="panel">

<h2>⚓ 海賊ランク</h2>

<div id="rank"></div>

<div id="visit"></div>

</section>

<section class="panel">

<h2>🎁 特典一覧</h2>

<ul>
<li>10個 → 枝豆サービス</li>
<li>20個 → ドリンク1杯無料</li>
<li>30個 → 裏メニューサービス</li>
</ul>

</section>

<footer>
勇者のみが辿り着ける秘密の酒場
</footer>

<script>

let stamps=Number(localStorage.getItem('stamps'))||0;
let visits=Number(localStorage.getItem('visits'))||0;

const STAFF_PASS='0358';

const today=new Date().toLocaleDateString();

const ranks=[
'見習い海賊',
'一等航海士',
'副船長',
'船長',
'四皇'
];

function render(){

const area=document.getElementById('stamps');

area.innerHTML='';

for(let i=1;i<=30;i++){

const div=document.createElement('div');

div.className='stamp '+(i<=stamps?'active':'');

div.innerHTML=i<=stamps?'☠️':'⚓';

area.appendChild(div);

}

let reward='来店してスタンプを集めよう！';

if(stamps>=30){

reward='🎉 裏メニューサービス解放！';

}else if(stamps>=20){

reward='🍺 ドリンク1杯無料！';

}else if(stamps>=10){

reward='🫛 枝豆サービス！';

}

document.getElementById('reward').innerHTML=reward;

let rankIndex=Math.floor(visits/10);

if(rankIndex>4){
rankIndex=4;
}

document.getElementById('rank').innerHTML=ranks[rankIndex];

document.getElementById('visit').innerHTML='来店回数 '+visits+'回';

localStorage.setItem('stamps',stamps);
localStorage.setItem('visits',visits);

}

function addStamp(){

let pass=prompt('店舗暗証番号を入力');

if(pass!==STAFF_PASS){

alert('暗証番号が違います');

return;

}

const lastStampDate=localStorage.getItem('lastStampDate');

if(lastStampDate===today){

alert('本日は既にスタンプ済みです');

return;

}

if(stamps<30){

stamps++;
visits++;

localStorage.setItem('lastStampDate',today);

render();

}

}

function resetToday(){

let pass=prompt('店舗暗証番号');

if(pass!==STAFF_PASS){

alert('暗証番号が違います');

return;

}

localStorage.removeItem('lastStampDate');

alert('本日の制限を解除しました');

}

function resetCard(){

let pass=prompt('店舗暗証番号');

if(pass!==STAFF_PASS){

alert('暗証番号が違います');

return;

}

if(confirm('カードをリセットしますか？')){

stamps=0;
visits=0;

localStorage.removeItem('lastStampDate');

render();

}

}

render();

</script>

</body>

</html>
